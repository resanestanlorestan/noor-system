name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          # .env.example placeholder is enough for install/build (no DB needed)
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - name: Typecheck
        run: npx tsc --noEmit --pretty false
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - name: Lint
        run: npm run lint
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      - name: Unit tests
        run: npx vitest run
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          APP_ENCRYPTION_KEY: 4f1bd9c73a5e2b8c6d90e7f4a1c3b5d8e9f0a2c4b6d8e0f2a4c6b8d0e2f4a6c8
